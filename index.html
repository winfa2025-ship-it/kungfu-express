<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e63946">
<meta name="description" content="Kungfu Express - AI-powered smart delivery platform. Smart routing, real-time tracking, and predictive analytics.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kungfu Express">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png">
<title>Kungfu Express – AI Smart Delivery App</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a0f;--surface:#12121a;--card:#1a1a28;--border:#2a2a3a;
--primary:#e63946;--primary-glow:#e6394640;--accent:#ff6b35;--gold:#ffd700;
--green:#00c853;--blue:#2196f3;--purple:#9c27b0;--cyan:#00bcd4;
--text:#f0f0f0;--text2:#8888aa;--text3:#555570;
}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scanBars{0%{width:5%}50%{width:100%}100%{width:5%}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(230,57,70,.4)}50%{box-shadow:0 0 0 10px transparent}}
.anim{animation:fadeUp .45s ease both}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:800;font-size:15px;border:none;transition:.2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--primary-glow)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{width:100%;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:14px}
.btn-ghost:hover{border-color:var(--primary)}
.btn-green{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--cyan));border:none;color:#fff;font-weight:800;font-size:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.section-label{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;color:var(--primary);background:var(--primary-glow)}
.h2{font-size:22px;font-weight:900;margin-bottom:4px}
.h3{font-size:16px;font-weight:800;margin-bottom:8px}
.sub{font-size:12px;color:var(--text2);margin-bottom:18px}
label.field{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:6px}
.input{width:100%;padding:13px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);color:var(--text);font-size:14px;outline:none;transition:.2s}
.input:focus{border-color:var(--primary)}
textarea.input{resize:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600}
/* ─── APP SHELL ─── */
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column}
.app-top{position:sticky;top:0;z-index:900;background:rgba(10,10,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.app-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.logo{font-size:18px;font-weight:900;letter-spacing:-.5px}
.logo b{color:var(--primary)}
.logo span{color:var(--accent)}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s}
.icon-btn:hover{border-color:var(--primary)}
/* role switcher */
.role-switch{display:flex;gap:4px;margin:0 16px 12px;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--border)}
.role-btn{flex:1;padding:9px;border-radius:9px;border:none;background:transparent;color:var(--text3);font-weight:700;font-size:12px;transition:.2s}
.role-btn.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.app-content{flex:1;padding:16px;padding-bottom:100px}
/* bottom nav */
.app-nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:rgba(18,18,26,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;z-index:1000;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;color:var(--text3);font-size:9px;font-weight:600;cursor:pointer;transition:.2s;border:none;background:none}
.nav-item .ni-icon{font-size:18px}
.nav-item.active{color:var(--primary)}
/* ─── ORDER SCREEN ─── */
.order-tabs{display:flex;gap:6px;margin-bottom:16px}
.order-tab{flex:1;padding:9px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;transition:.2s}
.order-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.addr-box{position:relative;display:flex;gap:12px;padding:16px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;margin-bottom:16px}
.addr-col{display:flex;gap:10px;width:100%}
.addr-icons{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.addr-icons .pin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.addr-icons .pin.a{background:rgba(230,57,70,.15);color:var(--primary)}
.addr-icons .pin.b{background:rgba(0,200,83,.15);color:var(--green)}
.addr-icons .line{flex:1;width:2px;background:var(--border);margin:4px 0}
.addr-fields{flex:1;display:flex;flex-direction:column;gap:10px}
.addr-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:3px}
.addr-suggest{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text2);margin-bottom:6px;cursor:pointer;transition:.2s}
.addr-suggest:hover,.addr-suggest.sel{border-color:var(--primary);color:var(--text);background:rgba(230,57,70,.05)}
.swap-btn{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--card);border:2px solid var(--border);color:var(--text);font-size:14px;z-index:2}
.delivery-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.dtype{padding:13px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);text-align:center;cursor:pointer;transition:.2s}
.dtype.active{border-color:var(--primary);background:rgba(230,57,70,.08)}
.dtype .dt-ic{font-size:22px;margin-bottom:4px}
.dtype .dt-lb{font-size:11px;font-weight:700}
.dtype .dt-fee{font-size:10px;color:var(--text3);margin-top:2px}
.cost-box{background:linear-gradient(135deg,rgba(230,57,70,.08),rgba(255,107,53,.08));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
.cost-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--text2)}
.cost-row.grand{font-weight:900;color:var(--text);font-size:16px;border-top:1px solid var(--border);padding-top:9px;margin-top:4px}
.pay-options{display:flex;gap:8px;margin-bottom:14px}
.pay-op{flex:1;padding:10px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);text-align:center;cursor:pointer;font-size:11px;color:var(--text2);transition:.2s}
.pay-op.active{border-color:var(--green);color:var(--text);background:rgba(0,200,83,.06)}
/* ─── AI ANALYSIS ─── */
.ai-scan{ text-align:center;padding:10px 0 16px}
.ai-scan-title{font-size:14px;font-weight:800;color:var(--primary);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.scan-line{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-bottom:10px}
.scan-line .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--accent));animation:scanBars 1.6s infinite}
.ai-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ai-metric{background:var(--bg);border-radius:12px;padding:13px;text-align:center;animation:fadeIn .4s ease both}
.ai-metric .mv{font-size:20px;font-weight:900}
.ai-metric .ml{font-size:10px;color:var(--text3);margin-top:2px}
.score-ring{display:flex;flex-direction:column;align-items:center;padding:6px}
.score-big{font-size:44px;font-weight:900;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.prog{height:7px;border-radius:4px;background:var(--bg);overflow:hidden;margin:10px 0}
.prog .fill{height:100%;border-radius:4px;transition:width 1.2s ease}
/* ─── COURIER CARD ─── */
.courier-card{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px}
.courier-av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.courier-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.mini-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:8px;background:var(--card);font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px}
/* ─── TRACKING ─── */
.map{width:100%;height:190px;border-radius:14px;background:linear-gradient(135deg,#0d1117,#161b22);position:relative;overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px}
.map-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--green);animation:pulseGlow 2s infinite}
.tracking-dash{display:flex;gap:8px;margin-bottom:14px}
.td{flex:1;background:var(--card);border-radius:12px;padding:11px;text-align:center}
.td .tv{font-size:17px;font-weight:900}
.td .tl{font-size:9px;color:var(--text3);margin-top:2px}
.stepper{position:relative;margin:6px 0}
.step{display:flex;gap:12px;padding:7px 0}
.step .sdot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;border:2px solid var(--border);color:var(--text3);transition:.3s}
.step.done .sdot{background:var(--green);border-color:var(--green);color:#fff}
.step.now .sdot{background:var(--primary);border-color:var(--primary);color:#fff;animation:blink 1.2s infinite}
.step .st-title{font-size:13px;font-weight:700}
.step .st-time{font-size:10px;color:var(--text3)}
.step.pending{opacity:.45}
/* ─── CHAT ─── */
.chat{display:flex;flex-direction:column;height:300px;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg);margin-bottom:14px}
.chat-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 13px;border-radius:13px;font-size:12.5px;line-height:1.5;animation:fadeUp .3s ease}
.msg.bot{background:var(--card);align-self:flex-start;border-bottom-left-radius:5px}
.msg.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.chat-actions{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border);flex-wrap:wrap}
.qa-chip{padding:7px 11px;border-radius:9px;background:var(--card);border:1px solid var(--border);font-size:11px;color:var(--text2);cursor:pointer;transition:.2s}
.qa-chip:hover{border-color:var(--primary);color:var(--text)}
/* ─── SIGNATURE ─── */
.sig-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sig-method{padding:13px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);text-align:center;cursor:pointer;transition:.2s}
.sig-method.active{border-color:var(--green);background:rgba(0,200,83,.06)}
.sig-method .sm-ic{font-size:22px;margin-bottom:4px}
.sig-method .sm-lb{font-size:10px;color:var(--text2)}
canvas#sigCanvas{width:100%;height:110px;background:var(--bg);border:2px dashed var(--border);border-radius:12px;margin-bottom:14px;display:block;touch-action:none}
/* ─── STARS ─── */
.stars{display:flex;gap:10px;justify-content:center;margin:8px 0 16px}
.star{font-size:36px;cursor:pointer;color:var(--text3);transition:.15s;border:none;background:none}
.star.active{color:var(--gold);transform:scale(1.08)}
.quick-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.qt{padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:11px;cursor:pointer;transition:.2s;color:var(--text2)}
.qt.sel{border-color:var(--gold);background:rgba(255,215,0,.1);color:var(--gold)}
/* ─── EARNINGS ─── */
.earn-hero{text-align:center;background:linear-gradient(135deg,rgba(230,57,70,.12),rgba(255,107,53,.12));border-radius:16px;padding:22px;margin-bottom:14px;border:1px solid var(--border)}
.earn-amt{font-size:38px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.earn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.earn-card{background:var(--card);border-radius:12px;padding:13px;text-align:center}
.bars{display:flex;align-items:end;gap:6px;height:90px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:5px 5px 0 0;background:linear-gradient(to top,var(--primary),var(--accent))}
.bar-lb{font-size:8px;color:var(--text3)}
/* ─── DASHBOARD ─── */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.dash{background:var(--card);border-radius:12px;padding:13px;text-align:center}
.dash .dv{font-size:22px;font-weight:900}
.dash .dl{font-size:9px;color:var(--text3);margin-top:2px}
.dash .dc{font-size:9px;font-weight:700;margin-top:3px}
.dc.up{color:var(--green)}
.heat{height:110px;border-radius:12px;background:linear-gradient(135deg,#1a0000,#330000,#660000,#003300,#006600);position:relative;overflow:hidden;margin-bottom:10px;border:1px solid var(--border)}
.heat-dot{position:absolute;border-radius:50%;animation:pulseGlow 3s infinite}
/* quick stat progress list */
.stat-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin:6px 0}
/* toasts */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--primary);color:var(--text);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:5000;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;top:80px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:4000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;width:100%;max-width:420px;animation:popIn .35s ease}
.modal-close{float:right;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.move-dot{position:absolute;font-size:15px;transform:translate(-50%,-100%);transition:top 3s ease,left 3s ease}
/* ─── LOGIN / ACCOUNT ─── */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:20px}
.login-logo{font-size:44px;margin-bottom:10px;animation:blink 3s ease-in-out infinite}
.login-title{font-size:26px;font-weight:900;margin-bottom:6px}
.login-title b{color:var(--primary)}
.login-title span{color:var(--accent)}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px;max-width:330px;line-height:1.6}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:360px;margin-bottom:16px}
.login-field{width:100%;padding:13px 14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);font-size:14px;outline:none;margin-bottom:12px;text-align:center}
.login-field:focus{border-color:var(--primary)}
.g_id_signin{width:100%!important;display:flex;justify-content:center}
.account-chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;cursor:pointer}
.account-chip img,.account-chip .av-fallback{width:32px;height:32px;border-radius:50%;object-fit:cover}
.av-fallback{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- TOPBAR -->
  <div class="app-top">
    <div class="app-topbar">
      <div class="logo" onclick="showHome()">🥋 <b>Kungfu</b><span>Express</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="gpsBtn" onclick="locate()" title="GPS">📍</button>
        <button class="icon-btn" onclick="showHelp()">?</button>
        <button class="account-chip" id="accountBtn" onclick="showAccountMenu()" title="Account"><div class="av-fallback">?</div></button>
      </div>
    </div>
    <div class="role-switch" id="roleSwitch">
      <button class="role-btn active" data-role="customer" onclick="setRole('customer')">🚀 Customer</button>
      <button class="role-btn" data-role="courier" onclick="setRole('courier')">🛵 Courier</button>
      <button class="role-btn" data-role="admin" onclick="setRole('admin')">🏢 Admin</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="app-content" id="content"></div>

  <!-- BOTTOM NAV -->
  <div class="app-nav" id="bottomNav"></div>
</div>

<div id="toast"></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
/* ═══════════════════ DATA & STATE ═══════════════════ */
const TYPES={
  doc:{label:'Document',icon:'📄',base:26,km:5.5},
  pkg:{label:'Package',icon:'📦',base:35,km:7},
  food:{label:'Fresh Food',icon:'🥬',base:40,km:8},
  cold:{label:'Cold Chain',icon:'🧊',base:52,km:10}
};
const ADDRESSES=['123 Nathan Road, Tsim Sha Tsui','88 Queen\u2019s Road, Central','15 Harbour Road, Wan Chai','45 Mong Kok Road, Kowloon','210 Festival Walk, Kowloon Tong'];
const COURIERS={
  alex:{name:'Alex Wong',rating:4.9,dist:1.2,acc:98,load:2,cap:5,veh:'Motorbike',icon:'🛵'},
  sarah:{name:'Sarah Li',rating:4.7,dist:2.8,acc:95,load:4,cap:8,veh:'Van',icon:'🚗'},
  mike:{name:'Mike Chen',rating:4.8,dist:3.5,acc:96,load:1,cap:5,veh:'Motorbike',icon:'🛵'}
};
const ORDER_STATUS_POINTS=['Order Created','Courier Assigned','Heading to Pickup','Package Picked Up','In Transit','Out for Delivery','Delivered'];
let ROLE='customer';
let TAB='home';
let order={
  pickup:'123 Nathan Road, Tsim Sha Tsui',
  delivery:'88 Queen\u2019s Road, Central',
  type:'pkg', pay:'card', qty:1,
  id:'KE-28451', courier:COURIERS.alex,
  status:0, paid:false, created:false,
  fare:58, createdMin:0
};
// ─── Real persistent app data (localStorage) ───
const DB_KEY='kungfu_db_v1';
let db=loadDB();
function loadDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(raw){const d=JSON.parse(raw);if(d&&d.orders)return d}
  }catch(e){}
  return {
    orders:[],             // completed/saved orders [customer side]
    courierJobs:[],        // courier delivery jobs completed

function getAvailableClientId(){
  // try both the config and an env-style global (some hosts inject it)
  if(GOOGLE_CLIENT_ID) return GOOGLE_CLIENT_ID;
  if(window.__KUNGFU_GOOGLE_CLIENT_ID) return window.__KUNGFU_GOOGLE_CLIENT_ID;
  return null;
}

function isLoggedIn(){try{return !!localStorage.getItem(SESSION_KEY)}catch(e){return !!user}}

function handleCredentialResponse(resp){
  try{
    const data=JSON.parse(atob(resp.credential.split('.')[1]));
    user={
      sub:data.sub,name:data.name,email:data.email,
      picture:data.picture,idToken:resp.credential
    };
    localStorage.setItem(SESSION_KEY,JSON.stringify(user));
    db.settings.name=user.name;
    saveDB();
    if(typeof initLoginUI==='function')initLoginUI();
    toast('👋 Welcome, '+user.name.split(' ')[0]+'!');
    render();
  }catch(e){toast('⚠️ Google sign-in failed')}
}

function logout(){
  user=null;
  try{localStorage.removeItem(SESSION_KEY)}catch(e){}
  if(window.google&&google.accounts){

  }
  document.querySelector('.app').classList.add('hidden');
  showLoginScreen();
}

function acceptOrder(){
  order.status=2;

  startWatch();

function simulateCourier(){
  let flow=['Heading to Pickup','Package Picked Up','In Transit','Out for Delivery','Delivered'];
  let si=0;
  const setStatus=(idx)=>{order.status=idx;refreshCourierCard();};
  setStatus(2);
  const int=setInterval(()=>{
    si++;
    if(si<flow.length-1){ // statuses 3,4,5
      order.status=2+si; // 3,4,5
      refreshCourierCard();
    }else if(si===flow.length-1){
      order.status=7 -1; // delivered index 6
      clearInterval(int);
      refreshCourierCard();
      // record completed courier job (real data)
      addCourierJob({id:order.id,pickup:order.pickup,delivery:order.delivery,fare:order.fare,type:order.type,status:'Delivered',courier:order.courier.name,duration:Math.floor(Math.random()*8+14)});
      toast('✅ Delivery complete! Earnings updated');
    }
  },2600);
}

let sigMode=0;
function setSig(m,el){
  sigMode=m;
  document.querySelectorAll('.sig-method').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sigHint').textContent=m===0?'Sign below to confirm :':m===1?'Scan QR at delivery point :':'Enter OTP code :';
}
function initSigCanvas(){
  const cv=document.getElementById('sigCanvas');
  if(!cv)return;
  const ctx=cv.getContext&&cv.getContext('2d');
  if(!ctx)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr;cv.height=cv.offsetHeight*dpr;
  ctx.scale(dpr,dpr);
  ctx.strokeStyle='#e63946';ctx.lineWidth=2.5;ctx.lineCap='round';
  let drawing=false;
  cv.onmousedown=cv.ontouchstart=e=>{drawing=true;const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;ctx.beginPath();ctx.moveTo(p.clientX-r.left,p.clientY-r.top);e.preventDefault()};
  cv.onmousemove=cv.ontouchmove=e=>{if(!drawing)return;const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;ctx.lineTo(p.clientX-r.left,p.clientY-r.top);ctx.stroke();e.preventDefault()};
  cv.onmouseup=cv.ontouchend=()=>drawing=false;
  // auto draw a sample signature for demo
  ctx.beginPath();ctx.moveTo(30,70);ctx.bezierCurveTo(50,20,80,110,110,60);ctx.bezierCurveTo(130,30,160,90,190,55);ctx.stroke();
}

function chatAsk(q){
  const b=document.getElementById('chatBody');
  if(!b)return;
  const label=q.replace('📦 ','' ).replace('📍 ','').replace('💰 ','').replace('⚠️ ','').replace('🔄 ','');

/* ═══════════════════ GPS LOCATION ═══════════════════ */
let gps={lat:null,lon:null,addr:null,accuracy:null,watchId:null,tracking:false};
function locate(){
  if(!navigator.geolocation){
    toast('📍 GPS not supported on this device');
    return;
  }
  toast('📍 Locating you…');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      gps.lat=pos.coords.latitude;gps.lon=pos.coords.longitude;
      gps.accuracy=Math.round(pos.coords.accuracy);
      reverseGeocode(pos.coords.latitude,pos.coords.longitude);
      if(typeof renderGPSBadge==='function')renderGPSBadge();
    },
    err=>{
      let m='📍 GPS permission denied';
      if(err.code===1)m='📍 GPS permission denied — enable in browser';
      if(err.code===2)m='📍 GPS position unavailable';
      if(err.code===3)m='📍 GPS timed out — try again';
      toast(m);
      // fallback geo
      fallbackGeo();
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
}
function startWatch(){
  if(gps.tracking||!navigator.geolocation)return;
  gps.tracking=true;
  gps.watchId=navigator.geolocation.watchPosition(
    pos=>{
      gps.lat=pos.coords.latitude;gps.lon=pos.coords.longitude;
      gps.accuracy=Math.round(pos.coords.accuracy);
      if(typeof renderGPSBadge==='function')renderGPSBadge();
    },
    ()=>{},
    {enableHighAccuracy:true,timeout:10000,maximumAge:3000}
  );
}
function fallbackGeo(){
  // best-effort coarse IP geolocation (no key)
  try{
    fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{
      if(d.latitude&&d.longitude){
        gps.lat=d.latitude;gps.lon=d.longitude;gps.accuracy=2000;
        gps.addr=(d.city||'')+', '+(d.country_name||'');
        if(typeof renderGPSBadge==='function')renderGPSBadge();
        toast('📍 Approx location ('+gps.addr+')');
      }
    }).catch(()=>{});
  }catch(e){}
}
function reverseGeocode(lat,lon){
  try{
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=16`)
      .then(r=>r.json())
      .then(d=>{
        const a=d.address||{};
        const city=a.city||a.town||a.village||a.road||'';
        const region=a.state||a.country||'';
        gps.addr=[a.road,a.suburb,a.city,a.state].filter(Boolean).slice(0,3).join(', ')||(city+' '+region);
        if(typeof renderGPSBadge==='function')renderGPSBadge();
        toast('📍 Location found: '+gps.addr);
      })
      .catch(()=>{toast('📍 Got coordinates ('+lat.toFixed(4)+','+lon.toFixed(4)+')')});
  }catch(e){}
}
function useMyLocation(){
  if(!gps.lat){locate();return}
  order.pickup=gps.addr||('My Location ('+gps.lat.toFixed(4)+','+gps.lon.toFixed(4)+')');
  bindOrderForm();
  toast('📍 Pickup set to your location'+(gps.accuracy?' (±'+gps.accuracy+'m)':''));
}
function setDeliveryGPS(){
  if(!gps.lat){locate();return}
  order.delivery=gps.addr||('My Location ('+gps.lat.toFixed(4)+','+gps.lon.toFixed(4)+')');
  bindOrderForm();
  toast('📍 Delivery set to your location'+(gps.accuracy?' (±'+gps.accuracy+'m)':''));
}
function renderGPSBadge(){
  const btn=document.getElementById('gpsBtn');
  if(btn){
    btn.textContent= gps.lat?'🟢':'📍';
    btn.title=gps.addr?('GPS: '+gps.addr):'GPS location';
  }
}
function showInstallBanner(deferred){
  let b=document.createElement('div');
  b.style.cssText='position:fixed;bottom:90px;left:16px;right:16px;z-index:3000;max-width:400px;margin:0 auto;background:#1a1a28;border:1px solid #e63946;border-radius:14px;padding:13px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:fadeUp .4s ease';
  b.innerHTML='<div style="font-size:26px">🥋</div><div style="flex:1"><div style="font-size:13px;font-weight:700">Install Kungfu Express</div><div style="font-size:11px;color:#8888aa">Add to home screen & open like an app</div></div><button id="ib" style="padding:8px 14px;border-radius:8px;background:linear-gradient(135deg,#e63946,#ff6b35);border:none;color:#fff;font-weight:700;font-size:12px">Install</button>';
  document.body.appendChild(b);
  document.getElementById('ib').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice}b.remove()};
}
